<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon-gold">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
    </div>
    <div class="brand-title-group">
      <span class="brand-title">THE ARCHIVE</span>
      <span class="brand-sub">IIIT KOTA · DIGITAL LIBRARY</span>
    </div>
  </div>

  <div class="sidebar-user">
    <div class="user-avatar">
      {{userInitial}}
    </div>
    <div class="user-details">
      <div class="user-name" title="{{userName}}">{{userName}}</div>
      <div class="user-role-badge">
        {{userRoleBadge}}
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    {{{navItems}}}
  </nav>

  <div class="sidebar-footer">
    <a href="/" class="sidebar-link" target="_blank" title="Open Public Website">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      <span>Public Portal</span>
    </a>
    <a href="/logout" class="sidebar-link" style="color: #f87171;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span>Sign Out</span>
    </a>
  </div>
</aside>
