<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px;">
  <!-- Profile Information Form -->
  <div class="content-card">
    <div class="card-header">
      <h2>Personal Information</h2>
    </div>
    <div class="card-body">
      {{{profileErrorAlert}}}

      <form method="POST" action="/student/profile">
        <input type="hidden" name="update_profile" value="1">

        <div class="form-group">
          <label class="form-label" for="full_name">Full Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="full_name" 
            name="full_name" 
            class="form-control" 
            value="{{profile.full_name}}" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label">Student / Roll ID Number</label>
          <input 
            type="text" 
            class="form-control" 
            value="{{profile.student_id_number}}" 
            disabled 
            style="background: #f1f5f9; cursor: not-allowed;"
          >
          <div class="form-help">Student ID is assigned by college administration and cannot be edited.</div>
        </div>

        <div class="form-group">
          <label class="form-label">Registered College Email</label>
          <input 
            type="email" 
            class="form-control" 
            value="{{profile.email}}" 
            disabled 
            style="background: #f1f5f9; cursor: not-allowed;"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            class="form-control" 
            value="{{profile.phone}}" 
            placeholder="+91 9876543210"
          >
        </div>

        <div class="form-group">
          <label class="form-label">Account Registration Date</label>
          <div style="font-size: 0.9rem; color: #475569; padding-top: 4px;">
            {{createdDateFormatted}}
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
          Save Profile Changes
        </button>
      </form>
    </div>
  </div>

  <!-- Password Change Form -->
  <div class="content-card">
    <div class="card-header">
      <h2>Change Security Password</h2>
    </div>
    <div class="card-body">
      {{{passwordErrorAlert}}}

      <form method="POST" action="/student/profile">
        <input type="hidden" name="change_password" value="1">

        <div class="form-group">
          <label class="form-label" for="current_password">Current Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="current_password" 
            name="current_password" 
            class="form-control" 
            placeholder="Enter current password" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="new_password" 
            name="new_password" 
            class="form-control" 
            placeholder="Min 6 characters" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-control" 
            placeholder="Retype new password" 
            required
          >
        </div>

        <button type="submit" class="btn btn-secondary" style="margin-top: 10px;">
          Update Password
        </button>
      </form>
    </div>
  </div>
</div>
